[package]
name = "lumbar"
version = "0.1.1"
edition = "2024"
description = "A hardware-agnostic cache and memory-hierarchy simulator for reasoning about access patterns before touching real hardware"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hz2/lumbar"
keywords = ["cache", "simulation", "memory-hierarchy", "performance"]
categories = ["simulation", "science"]

[features]
default = ["patterns"]
patterns = []
cli = ["patterns", "dep:clap", "dep:anyhow"]

[[bin]]
name = "lumbar"
path = "src/bin/lumbar.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
